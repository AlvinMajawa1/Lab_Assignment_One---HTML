<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="image" content="malawiFlag.png">
    <link rel="icon" href="malawiFlag.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <title>SkillShare Hub - Contact Us</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="find-skill.html">Find a Skill</a> |
            <a href="become-instructor.html">Become an Instructor</a> |
            <a href="testimonials.html">Testimonials</a> |
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Get in Touch</h2>
            <img src="malawiFlag.png" alt="Contact Us Banner" style="width:100%; height:200px;">
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>

                <label for="reason">Reason for Contact:</label>
                <select id="reason" name="reason">
                    <option value="general">General Inquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                </select><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" required></textarea><br>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 SkillShare Hub. All rights reserved.</p>
    </footer>
</body>
</html>
